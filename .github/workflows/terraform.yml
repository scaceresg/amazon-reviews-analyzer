name: terraform

on:
  push:
    branches:
      - development
      - master
      - "feature/**"
      - "hotfix/**"
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

permissions:
  id-token: write   # OIDC to AWS
  contents: read
  pull-requests: write

env:
  TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}

jobs:
  # Map branch to Terraform workspace: dev (feature/*, development) | prod (master, hotfix/*).
  resolve-env:
    runs-on: ubuntu-latest
    outputs:
      workspace: ${{ steps.map.outputs.workspace }}
    steps:
      - id: map
        run: |
          REF="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          case "$REF" in
            master|hotfix/*) echo "workspace=prod" >> "$GITHUB_OUTPUT" ;;
            *)               echo "workspace=dev"  >> "$GITHUB_OUTPUT" ;;
          esac

  checks:
    needs: resolve-env
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ vars.TF_VERSION }}
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Lint
        uses: terraform-linters/setup-tflint@v6.2.0
      - run: tflint --init && tflint --recursive
      - name: Validate
        run: terraform init -backend=false && terraform validate
      - name: Security scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          hide-progress: true
          exit-code: 1
          severity: HIGH,CRITICAL

  plan:
    needs: [resolve-env, checks]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ vars.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v6.2.0
        with:
          role-to-assume: ${{ secrets.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Init
        run: terraform init -backend-config="bucket=${TF_STATE_BUCKET}"
      - name: Select workspace
        run: terraform workspace select -or-create ${{ needs.resolve-env.outputs.workspace }}
      - name: Plan
        run: terraform plan

  apply:
    needs: [resolve-env, plan]
    if: ${{ github.ref_name == 'development' || github.ref_name == 'master' }}
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.workspace }}
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ vars.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v6.2.0
        with:
          role-to-assume: ${{ secrets.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Init
        run: terraform init -backend-config="bucket=${TF_STATE_BUCKET}"
      - name: Select workspace
        run: terraform workspace select -or-create ${{ needs.resolve-env.outputs.workspace }}
      - name: Apply
        run: terraform apply -auto-approve
