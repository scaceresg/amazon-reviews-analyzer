name: services

on:
  push:
    branches:
      - development
      - master
      - "feature/**"
      - "hotfix/**"
    paths:
      - "amazon_reviews_analyzer/**"
      - "pyproject.toml"
      - "config/**"
      - ".github/workflows/services.yml"

permissions:
  id-token: write   # OIDC to AWS
  contents: read

env:
  PROJECT_NAME: ${{ vars.PROJECT_NAME }}
  PROJECT_DIR_NAME: ${{ vars.PROJECT_DIR_NAME }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  DATALAKE_BUCKET_NAME: ${{ vars.DATALAKE_BUCKET_NAME }}

jobs:
  resolve-env:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.map.outputs.env }}
    steps:
      - id: map
        run: |
          REF="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          case "$REF" in
            master|hotfix/*) echo "env=prod" >> "$GITHUB_OUTPUT" ;;
            *)               echo "env=dev"  >> "$GITHUB_OUTPUT" ;;
          esac

  quality-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: ${{ vars.PYTHON_VERSION }}
      - name: Install deps
        run: uv sync --all-extras --dev
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: ${{ vars.PYTHON_VERSION }}
      - name: Install deps
        run: uv sync --all-extras --dev
      - name: Security audit
        run: uv run pip-audit
      - name: Container security scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: amazon_reviews_analyzer
          hide-progress: true
          exit-code: 1
          severity: HIGH,CRITICAL

  build-ingestion-job:
    needs: [resolve-env, quality-checks, security-audit]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.env }}
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6.2.0
        with:
          role-to-assume: ${{ secrets.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push ingestion job image
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          ENV: ${{ needs.resolve-env.outputs.env }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY/$PROJECT_NAME-ingestion:$ENV-${GITHUB_SHA::7}"
          docker build -f $PROJECT_DIR_NAME/ingestion/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
  
  deploy-ingestion-job:
    needs: [resolve-env, build-ingestion-job]
    if: ${{ github.ref_name == 'development' || github.ref_name == 'master' }}
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.env }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v6.2.0
        with:
          role-to-assume: ${{ secrets.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Register Batch job definition
        env:
          IMAGE: ${{ needs.build-ingestion-job.outputs.image }}
          ENV: ${{ needs.resolve-env.outputs.env }}
          BATCH_JOB_NAME: ${{ vars.BATCH_JOB_NAME }}
          BATCH_TASK_ROLE_ARN: ${{ secrets.BATCH_TASK_ROLE_ARN }}
          BATCH_EXECUTION_ROLE_ARN: ${{ secrets.BATCH_EXECUTION_ROLE_ARN }}
          BATCH_JOB_VCPU: "1"
          BATCH_JOB_MEMORY: "2048"
          LOG_GROUP: /aws/batch/${{ vars.BATCH_JOB_NAME }}-${{ needs.resolve-env.outputs.env }}
        run: |
          aws batch register-job-definition \
            --job-definition-name "$BATCH_JOB_NAME-$ENV" \
            --type container \
            --platform-capabilities FARGATE \
            --container-properties "$(jq -nc \
              --arg image              "$IMAGE" \
              --arg task_role          "$BATCH_TASK_ROLE_ARN" \
              --arg exec_role          "$BATCH_EXECUTION_ROLE_ARN" \
              --arg batch_job_vcpu     "$BATCH_JOB_VCPU" \
              --arg batch_job_memory   "$BATCH_JOB_MEMORY" \
              --arg log_group          "$LOG_GROUP" \
              --arg region             "$AWS_DEFAULT_REGION" \
              '{
                image:            $image,
                jobRoleArn:       $task_role,
                executionRoleArn: $exec_role,
                resourceRequirements: [
                  {type: "VCPU",   value: $batch_job_vcpu},
                  {type: "MEMORY", value: $batch_job_memory}
                ],
                networkConfiguration: {assignPublicIp: "ENABLED"},
                logConfiguration: {
                  logDriver: "awslogs",
                  options: {
                    "awslogs-group":         $log_group,
                    "awslogs-region":        $region,
                    "awslogs-stream-prefix": "ingestion"
                  }
                }
              }')"

